
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnimeMotion AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff4fa;color:#493346;font-family:Arial,sans-serif}
header{text-align:center;padding:35px 15px}
header h1{color:#d65b99;margin:0;font-size:30px}
header p{color:#98778b}
main{max-width:760px;margin:auto;padding:18px}
.card{background:white;border:1px solid #f0d5e4;border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 5px 18px #d65b9910}
h2,h3{color:#d65b99}
label{display:block;margin:16px 0 8px;font-weight:bold}
input,textarea{width:100%;padding:13px;border:1px solid #e8c4d8;border-radius:11px;background:#fffaff;color:#493346;font:inherit}
textarea{min-height:100px;resize:vertical}
button{width:100%;padding:15px;border:0;border-radius:12px;background:#e477ad;color:white;font-weight:bold;font-size:16px;margin-top:15px}
.secondary{background:#ad819b}
.character{border:1px solid #f0d5e4;border-radius:15px;padding:15px;margin-top:16px}
.preview{width:100%;max-height:220px;object-fit:contain;margin-top:10px;border-radius:12px}
.small{font-size:13px;color:#98778b}
.hidden{display:none}
.project{background:#fff0f7;padding:15px;border-radius:13px;margin-top:12px}
</style>
</head>
<body>
<header>
<h1>AnimeMotion AI</h1>
<p>Tu estudio personal de anime 2D</p>
</header>
<main id="app"></main>

<script>
const app=document.getElementById('app');
let db,current=null;

function openDB(){
 return new Promise((resolve,reject)=>{
  const request=indexedDB.open('AnimeMotionProjects',1);
  request.onupgradeneeded=()=>{
   request.result.createObjectStore('projects',{keyPath:'id'});
  };
  request.onsuccess=()=>{db=request.result;resolve()};
  request.onerror=()=>reject(request.error);
 });
}

function save(data){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('projects','readwrite');
  tx.objectStore('projects').put(data);
  tx.oncomplete=resolve;
  tx.onerror=()=>reject(tx.error);
 });
}

function getAll(){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('projects','readonly');
  const request=tx.objectStore('projects').getAll();
  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error);
 });
}

function getOne(id){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('projects','readonly');
  const request=tx.objectStore('projects').get(id);
  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error);
 });
}

function fileData(file){
 return new Promise((resolve,reject)=>{
  if(!file){resolve(null);return}
  const reader=new FileReader();
  reader.onload=()=>resolve(reader.result);
  reader.onerror=()=>reject(reader.error);
  reader.readAsDataURL(file);
 });

}

function escapeHTML(value){
 return String(value||'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}

function home(){
 current=null;
 app.innerHTML=`
 <div class="card" style="text-align:center;padding:35px">
 <h2>Bienvenido a tu estudio de anime</h2>
 <p>Comienza creando tu propia historia.</p>
 <button onclick="newProject()">＋ Crear nuevo proyecto</button>
 </div>
 <div id="projects"></div>`;
 listProjects();
}

async function listProjects(){
 const box=document.getElementById('projects');
 const projects=await getAll();
 if(!box||!projects.length)return;
 box.innerHTML='<div class="card"><h2>Mis proyectos</h2>'+
 projects.map(p=>`
 <div class="project">
 <h3>${escapeHTML(p.name)}</h3>
 <p>${escapeHTML(p.description)}</p>
 <button onclick="openProject('${p.id}')">Abrir proyecto</button>
 </div>`).join('')+'</div>';
}

function newProject(){
 app.innerHTML=`
 <div class="card">
 <h2>Crear nuevo proyecto</h2>
 <p class="small">Configura tu nueva historia de anime.</p>

 <label>Nombre del proyecto</label>
 <input id="name" placeholder="Ejemplo: Malasancera">

 <label>Descripción corta del proyecto</label>
 <textarea id="description" placeholder="Describe brevemente de qué trata tu anime..."></textarea>

 <div class="character">
 <h3>Personajes principales</h3>
 <label>Imagen del personaje 1</label>
 <input id="image1" type="file" accept="image/*">
 <div id="preview1"></div>
 <label>Nombre del personaje 1</label>
 <input id="name1" placeholder="Nombre del personaje">

 <label>Imagen del personaje 2</label>
 <input id="image2" type="file" accept="image/*">
 <div id="preview2"></div>
 <label>Nombre del personaje 2</label>
 <input id="name2" placeholder="Nombre del personaje">
 </div>

 <button onclick="createProject()">Crear proyecto</button>
 <button class="secondary" onclick="home()">Volver</button>
 </div>`;

 previewUpload('image1','preview1');
 previewUpload('image2','preview2');
}

function previewUpload(inputId,boxId){
 document.getElementById(inputId).onchange=async e=>{
  const data=await fileData(e.target.files[0]);
  document.getElementById(boxId).innerHTML=data?
   '<img class="preview" src="'+data+'">':'';
 };
}

async function createProject(){
 const name=document.getElementById('name').value.trim();
 const description=document.getElementById('description').value.trim();
 const f1=document.getElementById('image1').files[0];
 const f2=document.getElementById('image2').files[0];

 if(!name){alert('Escribe el nombre del proyecto.');return}
 if(!description){alert('Escribe una descripción corta.');return}
 if(!f1||!f2){alert('Selecciona las imágenes de los dos personajes.');return}

 const project={
  id:Date.now().toString(),
  name,description,
  char1:await fileData(f1),
  charname1:document.getElementById('name1').value.trim(),
  char2:await fileData(f2),
  charname2:document.getElementById('name2').value.trim(),
  scenes:[]
 };

 await save(project);
 openProject(project.id);
}

async function openProject(id){
 current=await getOne(id);
 if(!current)return;

 app.innerHTML=`
 <div class="card">
 <button class="secondary" onclick="home()">Volver a mis proyectos</button>
 <h2>${escapeHTML(current.name)}</h2>
 <p>${escapeHTML(current.description)}</p>
 <h3>Personajes principales</h3>
 <img class="preview" src="${current.char1}">
 <p>${escapeHTML(current.charname1||'Personaje 1')}</p>
 <img class="preview" src="${current.char2}">
 <p>${escapeHTML(current.charname2||'Personaje 2')}</p>
 <h3>Espacio de trabajo</h3>
 <p class="small">Tu proyecto está creado. Aquí construiremos las herramientas para diseñar y animar tus escenas.</p>
 </div>`;
}

openDB().then(home).catch(()=>{
 app.innerHTML='<div class="card"><h2>Error</h2><p>No se pudo abrir el almacenamiento.</p></div>';
});
</script>
</body>
</html>
