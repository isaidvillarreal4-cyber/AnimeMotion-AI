
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnimeMotion AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff4fa;color:#493346;font-family:Arial,sans-serif}
header{text-align:center;padding:28px 12px}
header h1{color:#d65b99;margin:0;font-size:30px}
header p,.small{color:#98778b}
main{max-width:760px;margin:auto;padding:15px}
.card{background:white;border:1px solid #f0d5e4;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 5px 18px #d65b9910}
h2,h3{color:#d65b99}
label{display:block;margin:16px 0 8px;font-weight:bold}
input,textarea,select{width:100%;padding:13px;border:1px solid #e8c4d8;border-radius:11px;background:#fffaff;color:#493346;font:inherit}
textarea{min-height:100px;resize:vertical}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#e477ad;color:white;font-weight:bold;font-size:15px;margin-top:12px}
.secondary{background:#ad819b}
.danger{background:#bd667d}
.character,.scene{border:1px solid #f0d5e4;border-radius:15px;padding:15px;margin-top:15px}
.preview{width:100%;max-height:220px;object-fit:contain;margin-top:10px;border-radius:12px}
.project{background:#fff0f7;padding:15px;border-radius:13px;margin-top:12px}
.refgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.refbox{background:#fff0f7;border:1px dashed #dca4c1;border-radius:12px;padding:8px;min-height:85px;text-align:center}
.refbox img{width:100%;height:85px;object-fit:contain}
.small{font-size:13px}
.timeline{border-left:3px solid #e477ad;padding-left:14px;margin:15px 0}
.sceneitem{background:#fff0f7;border-radius:12px;padding:13px;margin-bottom:12px}
.sceneitem img{width:100%;max-height:150px;object-fit:contain}
</style>
</head>
<body>
<header>
<h1>AnimeMotion AI</h1>
<p>Tu estudio personal de anime 2D</p>
</header>
<main id="app"></main>

<script>
const app=document.getElementById('app');
let db,current=null,referenceFiles=[],backgroundFiles=[];

function openDB(){
 return new Promise((resolve,reject)=>{
  const request=indexedDB.open('AnimeMotionProjects',1);
  request.onupgradeneeded=()=>{
   if(!request.result.objectStoreNames.contains('projects'))
    request.result.createObjectStore('projects',{keyPath:'id'});
  };
  request.onsuccess=()=>{db=request.result;resolve()};
  request.onerror=()=>reject(request.error);
 });
}

function save(data){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('projects','readwrite');
  tx.objectStore('projects').put(data);
  tx.oncomplete=resolve;
  tx.onerror=()=>reject(tx.error);
 });
}

function getAll(){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('projects','readonly');
  const r=tx.objectStore('projects').getAll();
  r.onsuccess=()=>resolve(r.result);
  r.onerror=()=>reject(r.error);
 });
}

function getOne(id){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('projects','readonly');
  const r=tx.objectStore('projects').get(id);
  r.onsuccess=()=>resolve(r.result);
  r.onerror=()=>reject(r.error);
 });
}

function fileData(file){
 return new Promise((resolve,reject)=>{
  if(!file){resolve(null);return}
  const reader=new FileReader();
  reader.onload=()=>resolve(reader.result);
  reader.onerror=()=>reject(reader.error);
  reader.readAsDataURL(file);
 });
}

function esc(value){
 return String(value||'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}

function home(){
 current=null;
 app.innerHTML=`
 <div class="card" style="text-align:center;padding:30px">
 <h2>Bienvenido a tu estudio de anime</h2>
 <p>Construye tu propia historia de anime 2D.</p>
 <button onclick="newProject()">＋ Crear nuevo proyecto</button>
 </div>
 <div id="projects"></div>`;
 listProjects();
}

async function listProjects(){
 const box=document.getElementById('projects');
 if(!box)return;

 const projects=await getAll();

 box.innerHTML='<div class="card"><h2>Mis proyectos</h2>'+
 (projects.length
  ? projects.slice().reverse().map(p=>`
   <div class="project">
    <h3>${esc(p.name)}</h3>
    <p>${esc(p.description)}</p>
    <button onclick="openProject('${p.id}')">Continuar editando</button>
   </div>`).join('')
  : '<p class="small">Todavía no has creado proyectos.</p>'
 )+'</div>';
}

function newProject(){
 app.innerHTML=`
 <div class="card">
 <h2>Crear nuevo proyecto</h2>
 <label>Nombre del proyecto</label>
 <input id="name" placeholder="Nombre de tu anime">
 <label>Descripción de la historia</label>
 <textarea id="description" placeholder="¿De qué tratará tu anime?"></textarea>
 <div class="character">
 <h3>Personajes principales</h3>
 <label>Imagen del personaje 1</label>
 <input id="image1" type="file" accept="image/*">
 <div id="preview1"></div>
 <label>Nombre del personaje 1</label>
 <input id="name1" placeholder="Nombre del personaje">
 <label>Imagen del personaje 2</label>
 <input id="image2" type="file" accept="image/*">
 <div id="preview2"></div>
 <label>Nombre del personaje 2</label>
 <input id="name2" placeholder="Nombre del personaje">
 </div>
 <button onclick="createProject()">Crear proyecto</button>
 <button class="secondary" onclick="home()">Volver</button>
 </div>`;
 previewUpload('image1','preview1');
 previewUpload('image2','preview2');
}

function previewUpload(inputId,boxId){
 document.getElementById(inputId).onchange=async e=>{
  const data=await fileData(e.target.files[0]);
  document.getElementById(boxId).innerHTML=data?
   '<img class="preview" src="'+data+'">':'';
 };
}

async function createProject(){
 const name=document.getElementById('name').value.trim();
 const description=document.getElementById('description').value.trim();
 const f1=document.getElementById('image1').files[0];
 const f2=document.getElementById('image2').files[0];
 if(!name||!description){alert('Completa el nombre y la descripción.');return}
 if(!f1||!f2){alert('Selecciona las imágenes de los dos personajes.');return}
 const project={
  id:Date.now().toString(),name,description,
  char1:await fileData(f1),
  charname1:document.getElementById('name1').value.trim(),
  char2:await fileData(f2),
  charname2:document.getElementById('name2').value.trim(),
  scenes:[]
 };
 await save(project);
 openProject(project.id);
}

async function openProject(id){
 current=await getOne(id);
 if(!current)return;
 if(!current.scenes)current.scenes=[];
 workspace();
}

function workspace(){
 app.innerHTML=`
 <div class="card">
 <button class="secondary" onclick="home()">← Volver a mis proyectos</button>
 <h2>${esc(current.name)}</h2>
 <p>${esc(current.description)}</p>
 <h3>Personajes principales</h3>
 <div class="character">
 <img class="preview" src="${current.char1}">
 <p>${esc(current.charname1||'Personaje 1')}</p>
 <img class="preview" src="${current.char2}">
 <p>${esc(current.charname2||'Personaje 2')}</p>
 </div>
 <button onclick="newScene()">＋ Crear nueva escena</button>
 <h3>🎬 Línea de tiempo del episodio</h3>
 <div id="timeline"></div>
 </div>`;
 showTimeline();
}


function newScene(){
 referenceFiles=[];
 backgroundFiles=[];
 app.innerHTML=`
 <div class="card">
 <button class="secondary" onclick="workspace()">← Volver al proyecto</button>
 <h2>Crear nueva escena</h2>

 <h3>¿Qué personajes aparecerán en esta escena?</h3>
 <p class="small">Selecciona uno o los dos personajes.</p>
 <div class="refgrid">
 <label class="refbox">
 <input type="checkbox" id="useChar1" checked>
 <img src="${current.char1}">
 <p>${esc(current.charname1||'Protagonista')}</p>
 </label>
 <label class="refbox">
 <input type="checkbox" id="useChar2">
 <img src="${current.char2}">
 <p>${esc(current.charname2||'Protagonista mujer')}</p>
 </label>
 </div>
 <button type="button" class="secondary" onclick="document.getElementById('useChar1').checked=true;document.getElementById('useChar2').checked=true;">Seleccionar ambos</button>
 <p class="small">Las imágenes de los personajes seleccionados se usarán como referencias.</p>

 <label>Otras imágenes de referencia (máximo 3)</label>
 <input id="references" type="file" accept="image/*" multiple>
 <div class="refgrid" id="refpreview"></div>

 <label>Imágenes del escenario (máximo 3)</label>
 <input id="backgrounds" type="file" accept="image/*" multiple>
 <div class="refgrid" id="backpreview"></div>

 <label>Describe lo que sucede en la escena</label>
 <textarea id="sceneDescription" placeholder="Describe los movimientos, expresiones, lugares y acciones de los personajes..."></textarea>

 <label>Duración de la escena</label>
 <select id="duration">
 <option value="5">5 segundos</option>
 <option value="8" selected>8 segundos</option>
 <option value="10">10 segundos</option>
 <option value="15">15 segundos</option>
 <option value="30">30 segundos</option>
 </select>

 <button onclick="addScene()">Guardar escena</button>
 <button class="secondary" onclick="workspace()">Cancelar</button>
 </div>`;

 document.getElementById('references').onchange=async e=>{
  const files=Array.from(e.target.files);
  if(files.length>3){
   alert('Puedes seleccionar un máximo de 3 imágenes.');
   e.target.value='';
   return;
  }
  referenceFiles=files;
  await previewFiles(files,'refpreview');
 };

 document.getElementById('backgrounds').onchange=async e=>{
  const files=Array.from(e.target.files);
  if(files.length>3){
   alert('Puedes seleccionar un máximo de 3 escenarios.');
   e.target.value='';
   return;
  }
  backgroundFiles=files;
  await previewFiles(files,'backpreview');
 };
}

async function previewFiles(files,boxId){
 const box=document.getElementById(boxId);
 box.innerHTML='';
 for(const file of files){
  const data=await fileData(file);
  const item=document.createElement('div');
  item.className='refbox';
  const img=document.createElement('img');
  img.src=data;
  item.appendChild(img);
  box.appendChild(item);
 }
}

async function addScene(){
 const description=document.getElementById('sceneDescription').value.trim();
 const duration=document.getElementById('duration').value;

 if(referenceFiles.length===0){
  alert('Sube al menos una imagen de referencia.');
  return;
 }
 if(!description){
  alert('Describe lo que sucede en la escena.');
  return;
 }

 const selectedCharacters=[];
 if(document.getElementById('useChar1').checked) selectedCharacters.push('char1');
 if(document.getElementById('useChar2').checked) selectedCharacters.push('char2');

 if(selectedCharacters.length===0){
  alert('Selecciona al menos un personaje.');
  return;
 }

 const refs=[];
 const backgrounds=[];

 for(const file of referenceFiles){
  refs.push(await fileData(file));
 }
 for(const file of backgroundFiles){
  backgrounds.push(await fileData(file));
 }

 current.scenes.push({
  id:Date.now().toString(),
  description,
  duration:Number(duration),
  characters:selectedCharacters,
  references:refs,
  backgrounds:backgrounds,
  video:null
 });

 await save(current);
 workspace();
}

function showTimeline(){
 const box=document.getElementById('timeline');
 if(!box)return;
 if(!current.scenes.length){
  box.innerHTML='<p class="small">Todavía no has agregado escenas.</p>';
  return;
 }
 box.innerHTML='<div class="timeline">'+
 current.scenes.map((s,i)=>`
 <div class="sceneitem">
 <h3>Escena ${i+1}</h3>
 <p>${esc(s.description)}</p>
 <p class="small">Duración: ${s.duration} segundos</p>
 <div class="refgrid">
 ${(s.references||[]).map(img=>`<img src="${img}">`).join('')}
 </div>
 <button class="danger" onclick="deleteScene('${s.id}')">Eliminar escena</button>
 </div>`).join('')+'</div>'+
 '<h3>Duración total: '+current.scenes.reduce((n,s)=>n+Number(s.duration),0)+' segundos</h3>';
}

async function deleteScene(id){
 if(!confirm('¿Quieres eliminar esta escena?'))return;
 current.scenes=current.scenes.filter(s=>s.id!==id);
 await save(current);
 workspace();
}

openDB().then(home).catch(()=>{
 app.innerHTML='<div class="card"><h2>Error</h2><p>No se pudo abrir el almacenamiento.</p></div>';
});
</script>
</body>
</html>
